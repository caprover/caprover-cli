name: Publish CLI release

on:
    release:
        types: [published]

jobs:
    validate-and-publish-npm:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            - name: Verify release version
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              shell: bash
              run: |
                  set -euo pipefail

                  PACKAGE_VERSION=$(node -p "require('./package.json').version")
                  EXPECTED_TAG="v${PACKAGE_VERSION}"

                  if [[ "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
                      echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION"
                      exit 1
                  fi

            - name: Install dependencies
              run: npm ci

            - name: Validate package
              run: |
                  npm run build
                  npm run formatter

            - name: Publish npm package
              run: npm publish --access public

    build-publish-docker-hub:
        needs: validate-and-publish-npm
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: azure/docker-login@v1
              with:
                  username: ${{ secrets.REGISTRY_USERNAME }}
                  password: ${{ secrets.REGISTRY_PASSWORD }}
            - uses: actions/checkout@v4
            - name: Build and push release to Docker Hub
              shell: bash
              run: ./.github/scripts/build_and_push_release.sh
